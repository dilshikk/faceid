[project]
name = "bot-control-center"
version = "1.2.0"
description = "Bot Control Center backend: FastAPI API, Telegram admin bot, and monitoring worker."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "passlib[argon2]==1.7.4",
    "pyotp==2.9.0",
    "aiogram==3.13.1",
    "httpx==0.27.2",
    "psutil==6.0.0",
    "python-dotenv==1.0.1",
    "cryptography==43.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
