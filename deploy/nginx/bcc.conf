# Place at /etc/nginx/sites-available/bcc.conf and symlink into sites-enabled.
# Terminates TLS; proxies only to the BCC API on localhost. Does not touch
# any existing site/server blocks for mado-bot, invitebot, bkbot, tgbot.
#
# Replace bots.example.com with your domain (3 places) and issue the TLS
# certificate BEFORE enabling this file: `nginx -t` fails without the cert files.

# Brute-force protection for the login endpoint (this file is included inside
# the http{} block, where limit_req_zone is allowed).
limit_req_zone $binary_remote_addr zone=bcc_login:10m rate=10r/m;

server {
    listen 80;
    server_name bots.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bots.example.com;

    ssl_certificate     /etc/letsencrypt/live/bots.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bots.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 1m;

    root /opt/bot-control-center/frontend/dist;
    index index.html;

    location = /api/v1/auth/login {
        limit_req zone=bcc_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
    }

    location / {
        try_files $uri /index.html;
    }
}
