# Place at /etc/nginx/sites-available/bcc.conf and symlink into sites-enabled.
# Terminates TLS; proxies only to the BCC API on localhost. Does not touch
# any existing site/server blocks for mado-bot, invitebot, bkbot, tgbot.

server {
    listen 80;
    server_name bots.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bots.example.com;

    ssl_certificate     /etc/letsencrypt/live/bots.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bots.example.com/privkey.pem;

    root /opt/bot-control-center/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8091/healthz;
    }

    location / {
        try_files $uri /index.html;
    }
}
